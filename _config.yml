# Cấu hình blog tkschut
title: tkschut
description: Góp nhặt những buổi chiều dịu dàng vào áng văn vụng về.
author: tkschut
lang: vi

# Blog dùng tên miền riêng (xem file CNAME)
url: "https://tkschutblog.com"
