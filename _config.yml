timezone: Asia/Ho_Chi_Minh
permalink: /bai-viet/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Các chủ đề hiện trên trang chủ (thêm hoặc đổi tên tuỳ ý)
