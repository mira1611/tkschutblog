  - Sống chậm
  - Chuyến đi
  - Tình yêu
  - Khác

# Mạng xã hội — thay bằng đường link trang cá nhân của bạn
social:
  facebook: "https://www.facebook.com/tkschut/"
  tiktok: "https://www.tiktok.com/"
  instagram: "https://www.instagram.com/tks.chut_/"

# Thu email "Thư chiều Chủ nhật" vào Google Sheet.
# Dán đường link Web app (kết thúc bằng /exec) vào giữa hai dấu ngoặc kép.
